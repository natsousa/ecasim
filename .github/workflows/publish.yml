name: publish-report

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the deploy-pages action (Pages source = "GitHub Actions").
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between an
# in-progress run and the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::quarto
            any::MatchIt
            any::survival
            any::survminer
            any::gtsummary
            any::ggplot2
            any::broom
            any::dplyr
            any::tibble
            any::rlang
            any::knitr
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install ecasim package
        run: Rscript -e 'devtools::install(".", upgrade = "never")'

      - name: Render Quarto report
        run: quarto render analysis/report.qmd

      - name: Stage site for Pages
        run: |
          mkdir -p _site
          cp analysis/report.html _site/index.html
          # Copy any supporting files generated next to the report
          # (figures, _files/ directory, etc.) if they exist.
          if [ -d analysis/report_files ]; then
            cp -r analysis/report_files _site/report_files
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
