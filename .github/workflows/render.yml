name: render-report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::quarto
            any::survminer
            any::gtsummary
            any::ggplot2
            any::knitr
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install ecasim package
        run: Rscript -e 'devtools::install(".", upgrade = "never")'

      - name: Run unit tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: Render Quarto report
        run: quarto render analysis/report.qmd

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: ecasim-report
          path: analysis/report.html
